services:
  mysql-v8:
    image: mysql:8.0
    container_name: mysql-v8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - docker-network

  rabbitmq-v4:
    image: rabbitmq:3-management
    container_name: rabbitmq-v4
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "15672:15672"
      - "5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - docker-network

  redis-v8:
    image: redis:8
    container_name: redis-v8
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - redis_data:/data
    networks:
      - docker-network

  backend:
    build:
      context: ./node
      dockerfile: Dockerfile.backend
    container_name: app_contas_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:' + process.env.PORT + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    env_file:
      - .env
    environment:
      PORT: ${BACKEND_PORT}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      RABBITMQ_HOST: rabbitmq-v4
      REDIS_HOST: redis-v8
      AUTH_SECRET: ${AUTH_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Enable development migrations/seeds (default: false). Set to "true" for dev environments.
      DEV_MIGRATE: "true"
      AUTH_TRUST_HOST: "true"
    depends_on:
      mysql-v8:
        condition: service_healthy
      rabbitmq-v4:
        condition: service_healthy
      redis-v8:
        condition: service_healthy
    networks:
      - docker-network

  frontend:
    build:
      context: ./react
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT}
    container_name: app_contas_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    env_file:
      - .env
    environment:
      PORT: ${FRONTEND_PORT}
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT}
      AUTH_SECRET: ${AUTH_SECRET}
      NEXT_PUBLIC_APP_NAME: app_contas
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - docker-network

volumes:
  db_data:
  rabbitmq_data:
  redis_data:

networks:
  docker-network:
    driver: bridge
